version: "3.9"
services:
  api:
    build:
      context: ./num-manage-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - app-network
  web:
    build:
      context: ./num-manage-web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3000
    depends_on:
      - api
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
