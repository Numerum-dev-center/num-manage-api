name: CI - Num-Manage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint + Build + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. LINT
      - name: Run lint
        run: pnpm lint

      # 2. BUILD
      - name: Build project
        run: pnpm build

      # 3. TEST
      - name: Run tests
        run: pnpm test